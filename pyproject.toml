[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "xmg-qa2"
version = "0.1.0"
description = "Digital technical support employee runtime"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.16,<2",
  "celery>=5.5,<6",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "langgraph>=0.6,<2",
  "langgraph-checkpoint-postgres>=2,<4",
  "psycopg[binary,pool]>=3.2,<4",
  "pwdlib[argon2]>=0.2,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "pyjwt>=2.10,<3",
  "sqlalchemy>=2.0,<3",
  "structlog>=25,<26",
  "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
  "import-linter>=2.3,<3",
  "mypy>=1.17,<2",
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/xmg_qa2"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".agents", ".specify"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["xmg_qa2"]
